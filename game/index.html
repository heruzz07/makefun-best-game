<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberdrift — forge a star from the dark</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b1d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Emberdrift: fly the skiff, collect embers, spend core on nova blasts, forge stars"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#eaf2ff;font-family:system-ui,sans-serif;padding:2rem">Emberdrift needs JavaScript to play.</p></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
